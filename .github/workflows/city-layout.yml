name: Survey city layout

# The city is built from the repositories themselves, not from a map of the web.
# This workflow walks every public repository under the account, writes
# public/city-layout.txt, commits it and asks the deploy workflow to publish, so
# the site only ever reads a file and visitors never wait on a live survey.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/survey-city.mjs'
      - '.github/workflows/city-layout.yml'
  workflow_dispatch:
  schedule:
    # Survey every six hours, so new repositories show up on their own.
    - cron: '23 */6 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: city-layout
  cancel-in-progress: true

jobs:
  survey:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Survey every repository
        env:
          # A token, so the survey is not limited to 60 anonymous API calls.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CITY_OWNER: ${{ github.repository_owner }}
        run: node scripts/survey-city.mjs

      - name: Commit the layout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/city-layout.txt
          if git diff --staged --quiet; then
            echo 'City layout is unchanged.'
            exit 0
          fi
          git commit -m 'chore: refresh the generated city layout'
          git pull --rebase --autostash
          git push
          # Pushes made with GITHUB_TOKEN do not trigger other workflows, so ask
          # the Pages deploy to run on the commit we just published.
          gh workflow run deploy.yml --ref main
